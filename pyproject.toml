[project]
name = "stateguard"
version = "0.1.0"
description = "StateGuard keeps autonomous workflows honest by reconciling what agents believe with what actually happened."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115.0",
  "mangum>=0.19.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "strands-agents>=1.55.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
