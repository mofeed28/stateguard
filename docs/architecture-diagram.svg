<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-label="StateGuard Architecture"><rect width="100%" height="100%" fill="#f3f6fa"/><rect x="0" y="0" width="1800" height="175" rx="0" fill="#112037" stroke="#112037" stroke-width="2"/><text x="65" y="80" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700">StateGuard</text><text x="65" y="125" fill="#c4d4eb" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">Check what the bot remembers against what actually happened.</text><rect x="1350" y="51" width="385" height="63" rx="13" fill="#20334e" stroke="#20334e" stroke-width="2"/><text x="1373" y="87" fill="#9dc6ff" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">IMPLEMENTED LOCAL SYSTEM</text><text x="65" y="236" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">01</text><text x="110" y="239" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Evidence</text><text x="660" y="236" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">02</text><text x="705" y="239" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Investigation</text><text x="1255" y="236" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">03</text><text x="1300" y="239" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Review &amp; recovery</text><rect x="65" y="285" width="480" height="195" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="85" y="309" width="6" height="147" rx="3" fill="#536cf0" stroke="#536cf0" stroke-width="2"/><text x="110" y="328" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">LOCAL RECORD</text><text x="110" y="370" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Saved send attempt</text><text x="110" y="412" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Saved before sending; acknowledgment</text><text x="110" y="444" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">deliberately withheld.</text><rect x="65" y="560" width="480" height="210" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="85" y="584" width="6" height="162" rx="3" fill="#148772" stroke="#148772" stroke-width="2"/><text x="110" y="603" fill="#148772" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">REAL PROVIDER · OAUTH 2.0</text><text x="110" y="645" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Gmail API</text><text x="110" y="687" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Fresh metadata for the existing</text><text x="110" y="719" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">self-email: matching message count, Sent</text><text x="110" y="751" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">and Inbox labels.</text><rect x="65" y="880" width="480" height="215" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="85" y="904" width="6" height="167" rx="3" fill="#7b6b96" stroke="#7b6b96" stroke-width="2"/><text x="110" y="923" fill="#7b6b96" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">SEPARATE TEST PATH</text><text x="110" y="965" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Provider sandbox</text><text x="110" y="1007" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Separate worker, evidence tools and</text><text x="110" y="1039" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">transactional gate. Tests healthy and</text><text x="110" y="1071" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">uncertain states.</text><rect x="660" y="380" width="480" height="255" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="680" y="404" width="6" height="207" rx="3" fill="#536cf0" stroke="#536cf0" stroke-width="2"/><text x="705" y="423" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">STRANDS TOOLS</text><text x="705" y="465" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Read-only evidence tools</text><text x="705" y="507" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">inspect_send_attempt</text><text x="705" y="539" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">query_gmail_receipt</text><text x="705" y="571" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400">Only scoped facts reach the model; no</text><text x="705" y="602" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400">mailbox address or message body.</text><rect x="660" y="745" width="480" height="265" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="680" y="769" width="6" height="217" rx="3" fill="#536cf0" stroke="#536cf0" stroke-width="2"/><text x="705" y="788" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">LIVE INVESTIGATION</text><text x="705" y="830" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Strands agent</text><text x="705" y="872" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">OpenAI / GPT-5 mini. Produces a</text><text x="705" y="904" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Pydantic-validated recommendation,</text><text x="705" y="936" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">actual tool trace and token usage.</text><text x="705" y="976" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">No send tool. No approval tool.</text><rect x="1255" y="285" width="480" height="195" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="1275" y="309" width="6" height="147" rx="3" fill="#536cf0" stroke="#536cf0" stroke-width="2"/><text x="1300" y="328" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">HUMAN REVIEW</text><text x="1300" y="370" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Operator dashboard</text><text x="1300" y="412" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Review evidence and diagnosis. Approve</text><text x="1300" y="444" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">local state reconciliation.</text><rect x="1255" y="590" width="480" height="265" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="1275" y="614" width="6" height="217" rx="3" fill="#148772" stroke="#148772" stroke-width="2"/><text x="1300" y="633" fill="#148772" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">DETERMINISTIC CONTROL</text><text x="1300" y="675" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">FastAPI recovery gate</text><text x="1300" y="717" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Rechecks Gmail and the decision version.</text><text x="1300" y="749" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Holds uncertainty; approval reconciles</text><text x="1300" y="781" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">local belief.</text><text x="1300" y="821" fill="#148772" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Gmail recovery never resends.</text><rect x="1255" y="940" width="480" height="150" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="1275" y="964" width="6" height="102" rx="3" fill="#536cf0" stroke="#536cf0" stroke-width="2"/><text x="1300" y="994" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">SQLite</text><text x="1300" y="1036" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Recovery state, versions and audit events</text><text x="1300" y="1068" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">on one persistent host.</text><polyline points="545,383 595,383 595,455 660,455" fill="none" stroke="#8091a7" stroke-width="3"/><polygon points="660,455 648.2941876694152,460.654551943446 648.2941876694152,449.345448056554" fill="#8091a7"/><polyline points="545,665 605,665 605,580 660,580" fill="none" stroke="#148772" stroke-width="3"/><polygon points="660,580 648.2941876694152,585.654551943446 648.2941876694152,574.345448056554" fill="#148772"/><polyline points="850,635 850,745" fill="none" stroke="#536cf0" stroke-width="3"/><polygon points="850,745 844.345448056554,733.2941876694152 855.654551943446,733.2941876694152" fill="#536cf0"/><polyline points="950,745 950,635" fill="none" stroke="#536cf0" stroke-width="3"/><polygon points="950,635 955.654551943446,646.7058123305848 944.345448056554,646.7058123305848" fill="#536cf0"/><text x="689" y="695" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">evidence</text><text x="960" y="695" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">tool calls</text><polyline points="1140,875 1194,875 1194,383 1255,383" fill="none" stroke="#536cf0" stroke-width="3"/><polygon points="1255,383 1243.2941876694151,388.654551943446 1243.2941876694151,377.345448056554" fill="#536cf0"/><text x="1150" y="337" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">report</text><polyline points="1495,480 1495,590" fill="none" stroke="#148772" stroke-width="3"/><polygon points="1495,590 1489.345448056554,578.2941876694152 1500.654551943446,578.2941876694152" fill="#148772"/><text x="1512" y="535" fill="#148772" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">approval</text><polyline points="1495,855 1495,940" fill="none" stroke="#148772" stroke-width="3"/><polygon points="1495,940 1489.345448056554,928.2941876694152 1500.654551943446,928.2941876694152" fill="#148772"/><text x="1512" y="901" fill="#148772" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">persist</text><rect x="65" y="1140" width="1670" height="130" rx="16" fill="#e7edf5" stroke="#e7edf5" stroke-width="2"/><text x="90" y="1175" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">DEMO BOUNDARY</text><text x="90" y="1213" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400">Real Gmail self-email; acknowledgment loss deliberately injected. Gmail may rewrite Message-ID, so subject/account/time correlation is weaker evidence. Bedrock is</text><text x="90" y="1244" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400">supported but quota-blocked; live exchange integration and shared cloud storage are next.</text></svg>