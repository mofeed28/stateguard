<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1490" viewBox="0 0 1800 1490" role="img" aria-label="StateGuard Architecture"><rect width="100%" height="100%" fill="#f3f6fa"/><rect x="0" y="0" width="1800" height="175" rx="0" fill="#112037" stroke="#112037" stroke-width="2"/><text x="65" y="80" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700">StateGuard</text><text x="65" y="125" fill="#c4d4eb" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">Check what the bot remembers against what actually happened.</text><rect x="1390" y="51" width="345" height="63" rx="13" fill="#20334e" stroke="#20334e" stroke-width="2"/><text x="1410" y="86" fill="#9dc6ff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">AWS + LOCAL ARCHITECTURE</text><text x="65" y="235" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">01  Two separate evidence paths</text><rect x="65" y="270" width="480" height="215" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="85" y="294" width="6" height="167" rx="3" fill="#536cf0" stroke="#536cf0" stroke-width="2"/><text x="110" y="313" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">SANDBOX · NO REAL SENDS</text><text x="110" y="355" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Sandbox worker + gate</text><text x="110" y="397" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Every minute via EventBridge. Healthy:</text><text x="110" y="429" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">one simulated delivery. Uncertain: wait.</text><text x="110" y="461" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Conflict: block retry.</text><rect x="660" y="270" width="480" height="215" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="680" y="294" width="6" height="167" rx="3" fill="#536cf0" stroke="#536cf0" stroke-width="2"/><text x="705" y="313" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">READ-ONLY STRANDS TOOLS</text><text x="705" y="355" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Sandbox evidence tools</text><text x="705" y="397" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">inspect_worker_history /</text><text x="705" y="429" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">query_delivery_provider read the</text><text x="705" y="461" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">simulated ledger and worker state.</text><rect x="65" y="540" width="480" height="215" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="85" y="564" width="6" height="167" rx="3" fill="#148772" stroke="#148772" stroke-width="2"/><text x="110" y="583" fill="#148772" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">REAL PROVIDER · CONTROLLED TEST</text><text x="110" y="625" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Existing Gmail send claim</text><text x="110" y="667" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">One previously sent self-email. Read</text><text x="110" y="699" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">fresh receipt metadata from Gmail with</text><text x="110" y="731" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">OAuth; no resend operation.</text><rect x="660" y="540" width="480" height="215" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="680" y="564" width="6" height="167" rx="3" fill="#148772" stroke="#148772" stroke-width="2"/><text x="705" y="583" fill="#148772" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">READ-ONLY STRANDS TOOLS</text><text x="705" y="625" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Gmail evidence tools</text><text x="705" y="667" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">inspect_send_attempt /</text><text x="705" y="699" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">query_gmail_receipt read the saved claim</text><text x="705" y="731" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">and fresh Gmail evidence.</text><rect x="1255" y="340" width="480" height="325" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="1275" y="364" width="6" height="277" rx="3" fill="#536cf0" stroke="#536cf0" stroke-width="2"/><text x="1300" y="383" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">ADVISORY ONLY</text><text x="1300" y="425" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Strands investigation</text><text x="1300" y="467" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">One agent per investigation, using the</text><text x="1300" y="499" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">matching pair of tools. OpenAI GPT-5</text><text x="1300" y="531" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">mini returns a validated diagnosis, tool</text><text x="1300" y="563" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">trace and measured usage.</text><text x="1300" y="628" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">No send tool. No approval tool.</text><polyline points="545,365 660,365" fill="none" stroke="#8091a7" stroke-width="3"/><polygon points="660,365 648.2941876694152,370.654551943446 648.2941876694152,359.345448056554" fill="#8091a7"/><polyline points="545,635 660,635" fill="none" stroke="#148772" stroke-width="3"/><polygon points="660,635 648.2941876694152,640.654551943446 648.2941876694152,629.345448056554" fill="#148772"/><polyline points="1140,365 1190,365 1190,420 1255,420" fill="none" stroke="#536cf0" stroke-width="3"/><polygon points="1255,420 1243.2941876694151,425.654551943446 1243.2941876694151,414.345448056554" fill="#536cf0"/><polyline points="1140,635 1210,635 1210,585 1255,585" fill="none" stroke="#148772" stroke-width="3"/><polygon points="1255,585 1243.2941876694151,590.654551943446 1243.2941876694151,579.345448056554" fill="#148772"/><text x="1148" y="351" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">evidence</text><text x="65" y="825" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">02  Review &amp; recovery</text><rect x="65" y="875" width="480" height="235" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="85" y="899" width="6" height="187" rx="3" fill="#536cf0" stroke="#536cf0" stroke-width="2"/><text x="110" y="918" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">SHARED STATE ON AWS</text><text x="110" y="960" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Versioned recovery state</text><text x="110" y="1002" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">AWS: DynamoDB conditional writes.</text><text x="110" y="1034" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Local: SQLite transactions. Separate</text><text x="110" y="1066" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">records for sandbox and Gmail; diagnosis</text><text x="110" y="1098" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">and audit events persist here.</text><rect x="660" y="875" width="480" height="235" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="680" y="899" width="6" height="187" rx="3" fill="#536cf0" stroke="#536cf0" stroke-width="2"/><text x="705" y="918" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">DETERMINISTIC AUTHORIZATION</text><text x="705" y="960" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">FastAPI on AWS Lambda</text><text x="705" y="1002" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Reads persisted state for the dashboard.</text><text x="705" y="1034" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">The recovery gate rechecks evidence</text><text x="705" y="1066" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">and the expected version before writing</text><text x="705" y="1098" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">a reconciliation.</text><rect x="1255" y="875" width="480" height="235" rx="18" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/><rect x="1275" y="899" width="6" height="187" rx="3" fill="#536cf0" stroke="#536cf0" stroke-width="2"/><text x="1300" y="918" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">HUMAN DECISION</text><text x="1300" y="960" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Operator dashboard</text><text x="1300" y="1002" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Review evidence, diagnosis and audit</text><text x="1300" y="1034" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">history. The operator requests approval</text><text x="1300" y="1066" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">through the API; reconciliation updates</text><text x="1300" y="1098" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">belief only.</text><polyline points="1495,665 1495,775 570,775 570,840 305,840 305,875" fill="none" stroke="#536cf0" stroke-width="3"/><polygon points="305,875 299.345448056554,863.2941876694152 310.654551943446,863.2941876694152" fill="#536cf0"/><text x="840" y="766" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">validated report saved to state</text><polyline points="545,945 660,945" fill="none" stroke="#8091a7" stroke-width="3"/><polygon points="660,945 648.2941876694152,950.654551943446 648.2941876694152,939.345448056554" fill="#8091a7"/><text x="556" y="931" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">read</text><polyline points="660,1035 545,1035" fill="none" stroke="#148772" stroke-width="3"/><polygon points="545,1035 556.7058123305848,1029.345448056554 556.7058123305848,1040.654551943446" fill="#148772"/><text x="559" y="1062" fill="#148772" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">write</text><polyline points="1140,945 1255,945" fill="none" stroke="#8091a7" stroke-width="3"/><polygon points="1255,945 1243.2941876694151,950.654551943446 1243.2941876694151,939.345448056554" fill="#8091a7"/><text x="1155" y="931" fill="#172438" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">view</text><polyline points="1255,1035 1140,1035" fill="none" stroke="#148772" stroke-width="3"/><polygon points="1140,1035 1151.7058123305849,1029.345448056554 1151.7058123305849,1040.654551943446" fill="#148772"/><text x="1147" y="1062" fill="#148772" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">approve</text><rect x="65" y="1170" width="1670" height="110" rx="16" fill="#e7edf5" stroke="#e7edf5" stroke-width="2"/><text x="90" y="1204" fill="#536cf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">RUNTIME &amp; SECRETS</text><text x="90" y="1242" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Lambda uses its IAM role for DynamoDB and Secrets Manager. OpenAI and Gmail credentials are read server-side from Secrets Manager. Local development uses</text><text x="90" y="1274" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">.env and ignored credential files.</text><rect x="65" y="1310" width="1670" height="140" rx="16" fill="#e7edf5" stroke="#e7edf5" stroke-width="2"/><text x="90" y="1344" fill="#148772" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">DEMO BOUNDARY</text><text x="90" y="1382" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Gmail acknowledgment loss is deliberately injected. Subject/account/time matching is weaker than a stable provider identifier. Sandbox atomicity does not</text><text x="90" y="1414" fill="#516174" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">guarantee exactly-once delivery to external APIs. Bedrock is optional; live trading integration is future work.</text></svg>